name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Job-ul de testare
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod sursa
        uses: actions/checkout@v4

      - name: Configurare JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executare teste Maven
        run: mvn test

  # 2. Job-ul de Build si Push Docker (ruleaza doar daca testul a trecut)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout cod sursa
        uses: actions/checkout@v4

      - name: Autentificare pe Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Configurare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire si publicare imagine Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Inlocuieste 'utilizator_dockerhub' si 'nume-proiect' cu datele tale
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nume-proiect:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nume-proiect:${{ github.sha }}